<div *ngIf="showBanner && licenseStatus" [class]="'license-banner ' + getBannerClass()">
  <div class="banner-content">
    <div class="banner-icon">
      <svg *ngIf="!licenseStatus.isValid || licenseStatus.daysRemaining <= 1" 
           xmlns="http://www.w3.org/2000/svg" 
           class="h-6 w-6" 
           fill="none" 
           viewBox="0 0 24 24" 
           stroke="currentColor">
        <path stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="2" 
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <svg *ngIf="licenseStatus.isValid && licenseStatus.daysRemaining > 1" 
           xmlns="http://www.w3.org/2000/svg" 
           class="h-6 w-6" 
           fill="none" 
           viewBox="0 0 24 24" 
           stroke="currentColor">
        <path stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="2" 
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <div class="banner-message">
      <p>{{ getBannerMessage() }}</p>
    </div>
    <div class="banner-actions">
      <button *ngIf="licenseStatus.licenseType === 'Demo' && licenseStatus.isValid" 
              type="button" 
              class="btn-upgrade" 
              (click)="onUpgrade()">
        Upgrade to 21 Days
      </button>
      <button *ngIf="!licenseStatus.isValid || licenseStatus.licenseType === 'Demo'" 
              type="button" 
              class="btn-purchase" 
              (click)="onPurchase()">
        Purchase License
      </button>
      <button type="button" 
              class="btn-dismiss" 
              (click)="dismissBanner()">
        <svg xmlns="http://www.w3.org/2000/svg" 
             class="h-5 w-5" 
             fill="none" 
             viewBox="0 0 24 24" 
             stroke="currentColor">
          <path stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="2" 
                d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
