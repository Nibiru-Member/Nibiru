<div
  *ngIf="isLoading"
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40"
>
  <div class="flex flex-col items-center gap-3">
    <svg
      class="w-10 h-10 text-blue-500 animate-spin"
      viewBox="0 0 100 100"
      xmlns="http://www.w3.org/2000/svg"
      role="status"
      aria-label="Loading"
    >
      <circle
        class="opacity-25"
        cx="50"
        cy="50"
        r="40"
        stroke="currentColor"
        stroke-width="10"
        fill="none"
      />
      <path
        class="opacity-75"
        fill="currentColor"
        d="M50 10a40 40 0 0 1 40 40h-8a32 32 0 0 0-32-32z"
      />
    </svg>

    <span class="text-white text-sm font-medium">
      Loading...
    </span>
  </div>
</div>
