<div class="custom-scroll max-h-[500px] overflow-y-auto pr-2">
  <!-- PDF Options -->
  <div class="mb-6">
    <h3 class="mb-1 text-sm font-medium">PDF Options</h3>
    <div class="ml-2 flex items-start justify-between gap-4">
      <div class="flex flex-col gap-3">
        <label class="flex cursor-pointer select-none items-center space-x-2">
          <input
            type="checkbox"
            class="form-checkbox text-primary h-4 w-4"
            [(ngModel)]="isMdf"
            [ngModelOptions]="{standalone: true}"
            (change)="onIsMdfChange($event)" />
          <span class="text-sm">PDF</span>
        </label>
        <label class="flex cursor-pointer select-none items-center space-x-2">
          <input
            type="checkbox"
            class="form-checkbox text-primary h-4 w-4"
            [(ngModel)]="isIndexMdf"
            [ngModelOptions]="{standalone: true}"
            (change)="onIsIndexMdfChange($event)" />
          <span class="text-sm">PDF + INDEX (recommended)</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Backup -->
  <div class="mb-6">
    <h3 class="mb-1 text-sm font-medium">Backup</h3>
    <div class="ml-2 flex items-start justify-between gap-4">
      <label class="flex cursor-not-allowed select-none items-center space-x-2 opacity-60">
        <input
          type="checkbox"
          class="form-checkbox text-primary h-4 w-4"
          [(ngModel)]="isBackup"
          [disabled]="true"
          (change)="onIsBackupChange($event)" />
        <span class="text-sm">Backup{{ backupPath && backupType ? ' - ' + backupPath : '' }}</span>
      </label>
    </div>
  </div>

  <!-- Optimize Index Settings -->
  <h3 class="mb-1 mt-4 text-sm font-medium">Optimize Index Settings</h3>
  <div class="mb-6 ml-2 grid grid-cols-2 gap-4">
    <label class="flex cursor-pointer items-center gap-2">
      <input
        type="radio"
        name="optimize"
        value="reorganize"
        [(ngModel)]="optimizeOption"
        (change)="onOptimizeOptionChange($event)" />
      <span>Reorganize</span>
    </label>

    <label class="flex cursor-pointer items-center gap-2">
      <input
        type="radio"
        name="optimize"
        value="rebuild"
        [(ngModel)]="optimizeOption"
        (change)="onOptimizeOptionChange($event)" />
      <span>Rebuild</span>
    </label>
  </div>

  <!-- Update Statistics and Recompile Stored Procedures -->
  <div class="mb-6 grid grid-cols-2 gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium">Update Statistics:</label>
      <select [(ngModel)]="updateStatistics" (change)="onUpdateStatisticsChange($event)" class="mt-2 w-full rounded-md border border-gray-600 bg-gray-800 px-3 py-2 text-sm text-white">
        <option value="" disabled>Select</option>
        <option value="never">Never</option>
        <option value="before-analysis-refresh">Before Analysis Refresh</option>
        <option value="before-optimization">Before Optimization</option>
      </select>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium">Recompile Stored Procedures:</label>
      <select [(ngModel)]="recompileProcedures" (change)="onRecompileProceduresChange($event)" class="mt-2 w-full rounded-md border border-gray-600 bg-gray-800 px-3 py-2 text-sm text-white">
        <option value="" disabled>Select</option>
        <option value="never">Never</option>
        <option value="always">Always</option>
      </select>
    </div>
  </div>

  <!-- Statistics Method -->
  <div class="mb-6">
    <label class="mb-1 block text-sm font-medium">Statistics Method:</label>
    <select [(ngModel)]="statisticsMethod" [disabled]="!statisticsMethodEnabled" class="mt-2 w-full rounded-md border border-gray-600 bg-gray-800 px-3 py-2 text-sm text-white disabled:opacity-40">
      <option value="" disabled>Select Statistics Method</option>
      <option value="fullscan">Fullscan</option>
      <option value="sample-percent-rows">SAMPLE n PERCENT | n ROWS</option>
      <option value="resample">RESAMPLE</option>
      <option value="persist-sample-percent">PERSIST_SAMPLE_PERCENT</option>
    </select>
  </div>

  <!-- Use NORECOMPUTE option -->
  <label class="mb-6 ml-2 flex cursor-pointer items-center gap-2">
    <input type="checkbox" [(ngModel)]="useNoRecompute" class="form-checkbox text-primary h-4 w-4" />
    <span class="text-sm">Use NORECOMPUTE option</span>
  </label>

  <!-- Automate -->
  <h3 class="mb-1 mt-4 text-sm font-medium">Automate</h3>
  <div class="mb-6 ml-2 grid grid-cols-2 gap-4">
    <label class="flex cursor-pointer items-center gap-2">
      <input
        type="radio"
        name="automate"
        [value]="true"
        [(ngModel)]="isAutomate"
        (change)="onIsAutomateChange($event)" />
      <span>Yes</span>
    </label>

    <label class="flex cursor-pointer items-center gap-2">
      <input
        type="radio"
        name="automate"
        [value]="false"
        [(ngModel)]="isAutomate"
        (change)="onIsAutomateChange($event)" />
      <span>No</span>
    </label>
  </div>

  <!-- Fill Factor -->
  <h3 class="mb-1 mt-2 text-sm font-medium">Fill Factor</h3>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium">Current Value:</label>
      <input
        type="text"
        [(ngModel)]="fillFactorCurrent"
        (input)="onFillFactorCurrentChange($event)"
        class="mt-2 w-full rounded-md border border-gray-600 bg-gray-800 px-3 py-2 text-sm text-white"
        placeholder="Enter current value" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium">New Value:</label>
      <input
        type="text"
        [(ngModel)]="fillFactorNew"
        (input)="onFillFactorNewChange($event)"
        class="mt-2 w-full rounded-md border border-gray-600 bg-gray-800 px-3 py-2 text-sm text-white"
        placeholder="Enter new value" />
    </div>
  </div>
</div>
